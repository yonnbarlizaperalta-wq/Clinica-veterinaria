{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Citas{% endblock %} | Clínica Huellitas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'citas.css' %}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark clinic-navbar">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'inicio' %}">Clínica Huellitas</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'citas:lista' %}">Citas</a>
        <a class="nav-link" href="{% url 'agenda_personal' %}">Agenda</a>
        <a class="nav-link" href="{% url 'admin:index' %}">Administración</a>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-md-5">
    {% if messages %}
      {% for message in messages %}<div class="alert alert-info" role="alert">{{ message }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="border-top bg-white py-3">
    <div class="container small text-secondary">Sistema académico de gestión veterinaria · Huellitas</div>
  </footer>
</body>
</html>
